version: '1.1.0'
changelog: |-
  :tada: New features and improvements
  ------------------------------------
  + Add support for item information lazy loading (#459) @hagaygo
  + Add duration as a sort option for video views (#460) @nonstatic

  Bug Fixes
  ---------
  + Catch http response exceptions in posts (#466) @mcarlton00
  + Fix uninterruptible keepalive timer blocking Kodi shutdown (#452) @kel-mo
  + Don't log in with an empty password when the prompt is cancelled (#462) @6801318d8d
  + Fix kodi webserver requests (#463) @Sab44
  + fix: restore folder browsing for home video/photo libraries (#450) @zalaare

  Code or Repo Maintenance
  ------------------------
  + Only import the profiler when profiling is enabled (#464) @Sab44

  CI & build changes
  ------------------
  + Remove python2 from CI (#467) @mcarlton00
  + Avoid potential script injection in the changelog (#453) @oddstr13
dependencies:
  py3:
    - addon: 'xbmc.python'
      version: '3.0.0'
    - addon: 'script.module.requests'
      version: '2.22.0+matrix.1'
    - addon: 'script.module.dateutil'
      version: '2.8.1+matrix.1'
    - addon: 'script.module.six'
      version: '1.14.0+matrix.2'
    - addon: 'script.module.kodi-six'
      version: '0.1.3+1'
    - addon: 'script.module.addon.signals'
      version: '0.0.5+matrix.1'
    - addon: 'script.module.websocket'
      version: '0.57.0+matrix.1'
